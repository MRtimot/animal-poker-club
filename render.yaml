# Render 免费部署（Blueprint）：游戏服务器（WebSocket 实时连接）
# 网页部署在 Vercel：在 Vercel 设置环境变量 VITE_GAME_SERVER=https://<本服务>.onrender.com
#
# 免费方案说明：
#   - 闲置约 15 分钟会休眠，下一次有人连接时自动唤醒（约 1 分钟）
#   - 每个工作区每月 750 小时免费实例时间，足够一个服务全天运行
#   - 不绑定付款方式时，超出免费额度只会暂停服务，不会产生费用
#   - 服务器重启 / 重新部署后，在线房间会消失（房间只保存在内存中）
#   - 不需要任何密钥；默认不使用数据库（玩家进度保存在各自浏览器中）
services:
  - type: web
    name: animal-poker-club
    runtime: node
    plan: free
    autoDeploy: false
    # 同时构建网页：只用 Render 也能直接玩；配合 Vercel 时这里的网页可以忽略
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # 允许哪些网页连接这台服务器，例如 https://animal-poker.vercel.app（多个用逗号分隔，
      # 支持 https://*.vercel.app 这样的通配）。部署时在 Render 面板里填写。
      - key: APC_ALLOWED_ORIGINS
        sync: false
